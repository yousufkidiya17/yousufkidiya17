name: Update profile art
# Refreshes the contribution graph SVG from real data.
# Runs every 5 minutes (fastest GitHub allows), plus on push and manual.


"on":
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: yousufkidiya17

      - name: Render animated contribution graph SVG
        run: python scripts/generate_streak_svg.py yousufkidiya17 contrib-heatmap.svg

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"