name: Update profile art
# Refreshes the contribution graph SVG from real data.
# Runs every 5 minutes (fastest GitHub allows), plus on push and manual.


"on":
  schedule:
    - cron: "0 */12 * * *"   # twice daily at 00:00 and 12:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape real contribution data (no auth needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: yousufkidiya17

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          file_pattern: "data/contributions.json contrib-heatmap.svg"